<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布信息 - 失物招领系统</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/navigation.css">
</head>
<body id="page-publish">

    <header class="main-header">
        <h1>失物招领平台</h1>
        <nav>
            <!-- 已登录用户显示 -->
            <div id="user-nav">
            <a href="index.html">返回主页</a>
            <a href="profile.html">个人中心</a>
            <a href="#" id="logout-btn">登出</a>
            </div>
            
            <!-- 未登录用户显示 -->
            <div id="guest-nav" style="display: none;">
                <a href="index.html">返回主页</a>
                <a href="login.html">登录</a>
                <a href="register.html">注册</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-container" style="margin-top: 2rem;">
            <h2>发布新信息</h2>
            <div id="publish-message-box"></div>
            <!-- 这个表单与之前模态框中的表单完全相同 -->
            <form id="publish-form">
                <div class="form-group">
                    <label>信息类型:</label>
                    <input type="radio" name="listing_type" value="lost" id="type-lost" checked> <label for="type-lost">我丢失了</label>
                    <input type="radio" name="listing_type" value="found" id="type-found"> <label for="type-found">我捡到了</label>
                </div>
                <div class="form-group">
                    <label for="item-name">物品名称</label>
                    <input type="text" id="item-name" name="item_name" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="category">物品类别</label>
                    <select id="category" name="category" required>
                        <option value="证件">证件（身份证/学生证/银行卡等）</option>
                        <option value="电子产品">电子产品（手机/电脑/耳机等）</option>
                        <option value="钥匙">钥匙</option>
                        <option value="书籍">书籍/资料</option>
                        <option value="衣物">衣物/鞋帽/饰品</option>
                        <option value="箱包">箱包/钱包</option>
                        <option value="文具">文具</option>
                        <option value="运动器材">运动器材</option>
                        <option value="其他" selected>其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description" id="description-label">详细描述（物品特征、丢失经过等）</label>
                    <textarea id="description" name="description" rows="4" required placeholder="请详细描述物品的外观、颜色、特殊标记、丢失经过、可能丢失的具体位置等信息，便于他人辨认。"></textarea>
                </div>
                <div class="form-group">
                    <label for="location-details" id="location-details-label">地点详情</label>
                    <input type="text" id="location-details" name="location_details" required>
                </div>
                
                <div class="form-group">
                    <label id="map-label">在地图上标记位置 (请点击地图)</label>
                    <div id="map-container" style="height: 400px; width: 100%; border: 1px solid #ddd;"></div>
                    <!-- 这个隐藏输入框用于存储坐标并随表单提交 -->
                    <input type="hidden" id="location-coordinates" name="location_coordinates">
                </div>
                

                <div class="form-group">
                    <label for="event-time" id="event-time-label">丢失/拾获时间</label>
                    <input type="datetime-local" id="event-time" name="event_time" required>
                </div>
                <div class="form-group">
                    <label for="image">上传图片 (可选)</label>
                    <input type="file" id="image" name="image" accept="image/*">
                </div>
                <button type="submit" id="publish-submit-btn">确认发布</button>
            </form>
        </div>
    </main>
    
    <script type="module" src="pages/publish.js"></script>
</body>
</html>
