<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - 失物招领系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="page-forgot-password">
    <div class="form-container">
        <h2>找回密码</h2>
        <div id="message-box"></div>
        
        <!-- 步骤 1: 输入邮箱 -->
        <form id="forgot-form-step1">
            <div class="form-group">
                <label for="email">请输入您的注册邮箱</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit">获取安全问题</button>
        </form>

        <!-- 步骤 2: 回答问题并重置密码 -->
        <div id="reset-section">
            <div class="form-group">
                <label>您的安全问题是:</label>
                <div id="security-question-display"></div>
            </div>
            <form id="forgot-form-step2">
                 <div class="form-group">
                    <label for="security-answer">安全问题答案</label>
                    <input type="text" id="security-answer" name="security-answer" required>
                </div>
                <div class="form-group">
                    <label for="verification-code">邮箱验证码</label>
                    <input type="text" id="verification-code" name="verification-code" required>
                </div>
                <div class="form-group">
                    <label for="new-password">新密码</label>
                    <input type="password" id="new-password" name="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-new-password">确认新密码</label>
                    <input type="password" id="confirm-new-password" required>
                </div>
                <button type="submit">重置密码</button>
            </form>
        </div>

        <a href="login.html" class="form-link">返回登录</a>
    </div>

    <script type="module" src="pages/forgot_password.js"></script>
</body>
</html>
