<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页 - 失物招领系统</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/navigation.css">
    <!-- 天地图API,请将YOUR_API修改为你的API -->
    <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=YOUR_API" type="text/javascript"></script>
</head>
<body id="page-index">

    <header class="main-header">
        <h1>失物招领平台</h1>
        <div id="match-notification" class="notification-textbox">您暂时没有新的消息</div>
        <nav>
            <!-- 已登录用户显示 -->
            <div id="user-nav" style="display: none; position: relative;">
            <a href="publish.html" class="nav-button">发布信息</a>
            <a href="profile.html">个人中心</a>
            <a href="#" id="logout-btn">登出</a>
            </div>
            
            <!-- 未登录用户显示 -->
            <div id="guest-nav">
                <a href="login.html" class="nav-button">登录</a>
                <a href="register.html">注册</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="search-container">
            <!-- 搜索表单 -->
            <form id="search-form">
                <input type="text" id="search-keyword" name="keyword" placeholder="输入物品名称或描述关键词...">
                <input type="date" id="search-date" name="date">
                <button type="submit">搜索</button>
            </form>
            <!-- 筛选按钮组 -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter-type="type" data-value="all">全部</button>
                <button class="filter-btn" data-filter-type="type" data-value="lost">只看丢失</button>
                <button class="filter-btn" data-filter-type="type" data-value="found">只看拾获</button>
                <button id="map-filter-btn" class="filter-btn">按地图位置筛选</button>
                <button class="filter-btn active" data-filter-type="sort" data-value="time_desc">按时间排序</button>
            </div>
        </div>
        <!-- 地图筛选模态框容器 -->
        <div id="map-filter-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">×</span>
                <h2>在地图上选择中心点并设置半径</h2>
                <div id="modal-map-container" style="height: 400px; width: 100%; border: 1px solid #ddd; margin-bottom: 1rem;"></div>
                <div class="form-group">
                    <label for="search-radius">搜索半径 (公里)</label>
                    <input type="number" id="search-radius" value="0.1" min="0.1" step="0.1">
                </div>
                <div class="form-group">
                    <p>已选中心点坐标: <span id="selected-coords-display">未选择</span></p>
                </div>
                <button id="apply-map-filter-btn" class="btn-solve">应用筛选</button>
                <button id="clear-map-filter-btn" style="background-color: #777; margin-top: 0.5rem;">清除位置筛选</button>
            </div>
        </div>

        <!-- 信息墙容器 -->
        <div class="listings-container" id="listings-wall">
            <!-- 物品卡片将由JS动态插入这里 -->
        </div>

        <div class="pagination" id="pagination-container">
            <!-- 分页链接将由JS动态插入这里 -->
        </div>
    </main>

    <script type="module" src="pages/index.js"></script>
</body>
</html>
